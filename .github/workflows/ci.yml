name: Testes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test.sqlite3
      DASHBOARD_USERNAME: test
      DASHBOARD_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q
      - run: node --check app/static/app.js
      - run: docker compose --env-file .env.example config --quiet
      - name: Construir imagem Docker
        run: docker build -t contratos-turvo:test .
      - name: Testar container HTTP com SQLite isolado
        run: |
          docker run -d --name contratos-turvo-smoke \
            -e DATABASE_URL=sqlite:////tmp/contratos-ci.sqlite3 \
            -e DASHBOARD_USERNAME=ci \
            -e DASHBOARD_PASSWORD=ci-pass \
            -p 127.0.0.1:18181:8000 contratos-turvo:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18181/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error -u ci:ci-pass http://127.0.0.1:18181/api/summary
          docker rm -f contratos-turvo-smoke
      - name: Testar stack Docker Compose com PostgreSQL real
        run: |
          docker compose --env-file .env.example up --build -d
          for i in $(seq 1 50); do
            if docker compose --env-file .env.example exec -T web python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env.example logs --tail=70
          exit 1
      - name: Encerrar stack de testes
        if: always()
        run: docker compose --env-file .env.example down -v --remove-orphans || true
